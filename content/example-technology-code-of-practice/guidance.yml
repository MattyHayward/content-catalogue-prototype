  - make-things-accessible.md
  - be-open-and-use-open-source.md
  - make-use-of-open-standards.md
  - use-cloud-first.md
  - make-things-secure.md
  - make-privacy-integral.md
  - share-and-reuse-technology.md
  - integrate-and-adapt-technology.md
  - make-better-use-of-data.md
  - define-your-purchasing-strategy.md
  - make-your-technology-sustainable.md
  - meet-the-service-standard.md
