# The values entries may use. A new value needs adding here first, so
# filters on the site stay consistent.

types:
  standard:
    label: Standard
    description: Requirements that services, teams or organisations are expected to meet, and are often assessed against.
    layout: requirements
  principles:
    label: Principles
    description: A short set of principles to apply, without detailed requirements.
    layout: requirements
  policy:
    label: Policy
    description: A government position that organisations are expected to follow.
    layout: policy
  strategy:
    label: Strategy
    description: Direction and priorities for government, with the commitments that come from them.
    layout: guide
  guidance:
    label: Guidance
    description: Advice on how to do something well, to apply with judgement.
    layout: guide
  method:
    label: Method
    description: A way of working, followed as a sequence of steps.
    layout: steps
  resource:
    label: Resource
    description: A collection of material to draw on, such as a design system, handbook or learning hub.
    layout: tool
  product:
    label: Product
    description: A service or platform that teams use or build on.
    layout: tool
  blog:
    label: Blog
    description: Posts sharing news, work in progress and lessons learnt.
    layout: media

# How widely an entry is meant to be used, from the whole public sector to one
# organisation.
scope:
  public-sector:
    label: Public sector
    description: For use anywhere in the public sector.
  government:
    label: Central government
    description: For central government departments and their bodies.
  devolved:
    label: Devolved government
    description: For one devolved government and its bodies.
  organisation:
    label: Single organisation
    description: Written for one organisation, but may be useful to others as an example.

