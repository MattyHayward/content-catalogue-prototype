id: gov-uk-prototype-kit
title: GOV.UK Prototype Kit
short_description: Quickly make interactive, accessible and realistic prototypes of GOV.UK services
long_description: >-
  It uses GOV.UK Design System components, so prototypes look and behave like
  real services and can be tested with users before any production code is
  written. You don't need to be an experienced developer to use it.
