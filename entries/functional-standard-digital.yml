id: functional-standard-digital
title: "Government Functional Standard GovS 005: Digital"
short_description: What government expects of how departments manage digital, data and technology
long_description: >-
  The Digital functional standard sets out what is expected of government
  organisations in managing digital, data and technology: governance,
  planning, delivering services, managing technology and data, and the
  capability needed to do so. It is part of the set of government functional
  standards.
