id: ncsc-cloud-security-principles
title: Cloud security principles
short_description: The 14 principles for evaluating the security of a cloud service
long_description: >-
  The NCSC's cloud security principles describe what to look for when
  evaluating the security of a cloud service, from protecting data in transit
  and at rest to separating customers, securing supply chains and monitoring
  for attacks.
