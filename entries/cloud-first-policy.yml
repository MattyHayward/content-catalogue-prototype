id: cloud-first-policy
title: Cloud First Policy
short_description: The government introduced a ‘Cloud First’ policy in 2013 for all technology decisions
long_description: >-
  It expects public sector organisations to consider and fully evaluate
  potential public cloud solutions first, before any other option. It explains
  when other approaches may be justified, and how the policy relates to buying
  and hosting technology.
