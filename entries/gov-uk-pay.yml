id: gov-uk-pay
title: GOV.UK Pay
short_description: The best way to take payments for public services
long_description: >-
  Services can take card, Apple Pay and Google Pay payments, issue refunds and
  reconcile transactions, either through the API or by creating payment links
  without writing code. GOV.UK Pay handles PCI compliance, so services don't
  have to.
