id: enterprise-architecture-resources
title: OCTO enterprise architecture resources
short_description: Enterprise architecture guidance for government digital services
long_description: >-
  It includes reference architectures for citizen-facing services and local
  government, a digital technology capability model, self-assessment tools for
  software architecture maturity, and guidance on implementing AI. It aims to
  reduce duplication and help organisations make interoperable, well-informed
  technology investments.
