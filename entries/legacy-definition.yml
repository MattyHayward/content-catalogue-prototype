id: legacy-definition
title: Definition of Legacy IT
short_description: Explains how the public sector currently defines the term ‘legacy IT’
long_description: >-
  The updated definition treats legacy as more than age: a system can be
  legacy if it is end of life, out of supplier support, impossible to update,
  no longer cost-effective or above acceptable risk. Organisations use it with
  the legacy IT risk assessment framework to identify and prioritise systems.
type: guidance
scope: public-sector
tags: [strategy, legacy]
professions: [architecture, it-operations]
