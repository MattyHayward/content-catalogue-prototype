id: moj-reuse-library
title: MoJ Reuse Library
short_description: Bringing together reusable elements for all departments to use
long_description: >-
  It brings together components, patterns, design systems, guidance and other
  reusable work from teams across government, along with research and design
  histories. It helps teams find existing work and connect with others working
  on similar problems.
