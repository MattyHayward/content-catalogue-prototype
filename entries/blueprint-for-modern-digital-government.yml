id: blueprint-for-modern-digital-government
title: A blueprint for modern digital government
short_description: A long-term vision and six-point plan for digital public services across UK government, published January 2025
long_description: >-
  It is built around six priorities: joining up public sector services,
  harnessing AI for the public good, strengthening and extending digital and
  data infrastructure, elevating leadership and growing talent, funding for
  outcomes and procuring for growth, and committing to transparency. It is the
  starting point for the roadmap for modern digital government.
