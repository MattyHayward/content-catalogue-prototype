id: gdpr-guidance-and-resources
title: UK GDPR guidance and resources
short_description: Guidance and tools to help organisations comply with UK GDPR
long_description: >-
  The ICO explains each part of the UK General Data Protection Regulation,
  including the lawful bases for processing, individuals' rights,
  accountability and data protection impact assessments. It also offers
  checklists and templates to help organisations put compliance into practice.
