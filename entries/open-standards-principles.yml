id: open-standards-principles
title: Open Standards principles
short_description: The principles government follows when choosing open standards for software and data
long_description: >-
  The Open Standards principles set out how government selects and specifies
  open standards for software interoperability, data and document formats,
  so that systems work together and organisations avoid being locked in to
  one supplier.
