id: open-standards-principles
title: Open standards principles
short_description: Helps smallest suppliers compete with the largest
long_description: >-
  They set out how government selects and specifies open standards for
  software interoperability, data and document formats, so that systems work
  together and organisations avoid being locked in to one supplier. Government
  bodies are expected to follow them when choosing technology.
