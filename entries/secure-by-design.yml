id: secure-by-design
title: Secure by Design
short_description: What government delivery teams and security professionals need to do to incorporate effective cyber security practices when building digital services and technical infrastructure.
long_description: >-
  It makes security an integral part of digital services: managing security
  risk from the start of delivery and throughout the service's life, with
  clear ownership of risk and principles teams apply at each stage. Central
  government departments are expected to follow it.
