id: secure-by-design
title: Secure by Design
short_description: Building security into government digital services from the start, and throughout their life
long_description: >-
  Secure by Design is government's approach to making security an integral
  part of digital services: managing security risk from the start of
  delivery and throughout the service's life, with clear ownership of risk
  and principles teams apply at each stage.
