id: managing-legacy-technology
title: Managing legacy technology
short_description: This describes how the government should manage legacy technology
long_description: >-
  It covers how to identify and assess legacy systems, the risks they carry,
  and options for dealing with them such as replacing, migrating or retiring
  them. It also helps organisations prioritise which legacy to tackle first
  and make the case for funding.
