id: api-technical-and-data-standards
title: API technical and data standards
short_description: How to design, build and document APIs in government
long_description: >-
  The API technical and data standards help government teams build APIs that
  are consistent, secure and easy to use: using RESTful approaches and open
  standards, securing and versioning APIs, documenting them, and making them
  discoverable.
