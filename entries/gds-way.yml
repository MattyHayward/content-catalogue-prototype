id: gds-way
title: The GDS Way
short_description: How GDS teams build and run software, from choosing languages to handling incidents
long_description: >-
  The GDS Way documents the standards and guidance that teams in GDS Digital
  Products follow to build and operate digital services: the technology, tools
  and processes they use, from code review and continuous delivery to hosting,
  monitoring and incident management. It is written for GDS, and is a useful
  reference for teams elsewhere in government.
