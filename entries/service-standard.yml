id: service-standard
title: Service Standard
short_description: The 14 points government services are expected to meet, and are assessed against
long_description: >-
  The Service Standard helps teams create and run great public services. Its
  14 points cover understanding users and their problems, making the service
  simple and accessible, working in a multidisciplinary agile team, choosing
  the right tools and technology, and operating a reliable, secure service.
