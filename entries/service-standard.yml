id: service-standard
title: GOV.UK Service Standard
short_description: Helps you create and run great public services
long_description: >-
  Its 14 points cover understanding users and their problems, making the
  service simple and accessible, working in a multidisciplinary agile team,
  choosing the right tools and technology, and operating a reliable, secure
  service. Central government services are assessed against it as they move
  through alpha, beta and live.
